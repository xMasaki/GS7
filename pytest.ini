[pytest]
# Executar na raiz do projeto:  python -m pytest
addopts = --import-mode=importlib -q
pythonpath =
    app/backend
    01-Generative-AI-Engineering/src
    02-Big-Data-Architecture/src
    04-Applied-Computer-Vision/src
testpaths =
    app/backend/tests
    01-Generative-AI-Engineering/tests
    02-Big-Data-Architecture/tests
    03-Business-Intelligence-Startup/tests
    04-Applied-Computer-Vision/tests
    05-Robotic-Process-Automation/tests
    06-Secure-DevOps-Cloud/tests
    07-Project-Based-Maker-Lab/tests
    tools/tests
filterwarnings =
    ignore::DeprecationWarning
