# =====================================================================
# Prometheus — AcessaCidade (stack LOCAL via docker compose)
# Coleta /metrics do container "app" na rede interna do Compose.
# Para monitorar o MVP publicado na Azure use prometheus.azure.yml
# (no .env: PROMETHEUS_CONFIG=prometheus.azure.yml).
# =====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    projeto: acessacidade
    ambiente: local

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: acessacidade-local
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["app:8000"]
        labels:
          ambiente: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # ------------------------------------------------------------------
  # Alternativa: coletar também do MVP na Azure a partir deste mesmo
  # arquivo (descomente e preencha o FQDN gerado pelo Terraform —
  # output "container_fqdn"). Prefira prometheus.azure.yml.
  # ------------------------------------------------------------------
  # - job_name: acessacidade-azure
  #   metrics_path: /metrics
  #   scheme: http
  #   static_configs:
  #     - targets: ["SEU-DNS-LABEL.brazilsouth.azurecontainer.io:8000"]  # [PREENCHER: container_fqdn:8000]
  #       labels:
  #         ambiente: azure
