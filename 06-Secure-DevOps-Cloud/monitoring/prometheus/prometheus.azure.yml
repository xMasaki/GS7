# =====================================================================
# Prometheus — AcessaCidade (Prometheus/Grafana LOCAIS apontando para o
# MVP PUBLICADO na Azure Container Instances).
#
# [PREENCHER] Troque "SEU-DNS-LABEL.brazilsouth.azurecontainer.io" pelo
# valor do output Terraform "container_fqdn":
#   terraform -chdir=06-Secure-DevOps-Cloud/terraform output -raw container_fqdn
# Ative no .env:  PROMETHEUS_CONFIG=prometheus.azure.yml
# e suba:         docker compose --profile monitoring up -d prometheus alertmanager grafana
# =====================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    projeto: acessacidade
    ambiente: azure

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: acessacidade-azure
    metrics_path: /metrics
    scheme: http   # ACI não oferece HTTPS nativo (ver docs/ARQUITETURA_CLOUD.md)
    static_configs:
      - targets: ["SEU-DNS-LABEL.brazilsouth.azurecontainer.io:8000"]  # [PREENCHER: container_fqdn:8000]
        labels:
          ambiente: azure

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
