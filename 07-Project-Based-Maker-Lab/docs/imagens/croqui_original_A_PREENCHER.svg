<text x="10.000" y="19.000" font-size="2.8" text-anchor="start" fill="#000" font-weight="normal" font-family="DejaVu Sans, Arial, sans-serif">Imprima esta folha, leve ao local e anote as medidas (mm). Não há valores: tudo deve vir da medição real.</text>
